<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proctorly AI - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .role-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .toggle-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }
        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        #form-step {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="auth-page">
    <!-- Interactive 3D Background covers entire screen -->
    <div id="canvas-container"></div>

    <div class="auth-layout">
        
        <!-- Branding Top Center -->
        <div class="auth-branding" style="text-align: center; margin-bottom: 40px;">
            <h1 class="auth-title">Proctorly AI</h1>
            <p class="auth-subtitle" style="margin: 0 auto;">
                Automated precision in remote examinations. Register today to access the 
                future of academic supervision and biometric tracking.
            </p>
        </div>

        <!-- Auth Form Center -->
        <div class="glass-card">
            <h2 style="text-align: center; margin-bottom: 8px; font-weight:700;">Create Account</h2>
            <p class="login-subtitle">Choose your registration context.</p>

            <div class="role-toggle">
                <button id="tab-student" class="toggle-btn active" onclick="setRole('student')">Join as Student</button>
                <button id="tab-teacher" class="toggle-btn" onclick="setRole('admin')">Join as Teacher</button>
            </div>
            
            <div id="form-step">
                <input type="text" id="username" placeholder="Username (e.g. ID or Handle)" style="margin-bottom: 16px;">
                <input type="text" id="fullname" placeholder="Full Name" style="margin-bottom: 16px;">
                <input type="password" id="password" placeholder="Password" style="margin-bottom: 24px;">
                
                <button onclick="registerUser()" id="btn-register" class="btn btn-primary" style="width: 100%;">Register as Student</button>
                <p style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
                    Already have an account? <a href="/" style="color: var(--primary); font-weight:600; text-decoration: none;">Login Here</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Background 3D Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <!-- Page Logic & Animations -->
    <script src="/static/js/auth.js"></script>
    <script type="module">
        // 1. Initialize Vanta 3D Background
        VANTA.NET({
            el: "#canvas-container",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x3b82f6,
            backgroundColor: 0x000000,
            points: 12.00,
            maxDistance: 22.00,
            spacing: 18.00
        });

        // 2. Framer Motion Animations via Motion JS
        import { animate, spring } from "https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm";

        // Initial Card Reveal
        animate(".glass-card", 
            { y: [40, 0], opacity: [0, 1] }, 
            { duration: 0.8, easing: spring({ stiffness: 100, damping: 15 }) }
        );

        // Initial Branding Reveal
        animate(".auth-branding", 
            { x: [-50, 0], opacity: [0, 1] }, 
            { duration: 1, delay: 0.2, easing: spring({ stiffness: 100, damping: 20 }) }
        );

        // Export animation helper to global window for role toggling
        window.triggerBounce = () => {
            animate(".glass-card", { scale: [0.98, 1] }, { duration: 0.3, easing: "ease-out" });
        };
    </script>
    
    <script>
        let currentRole = 'student';

        function setRole(role) {
            currentRole = role;
            document.getElementById('tab-student').classList.remove('active');
            document.getElementById('tab-teacher').classList.remove('active');
            
            if (role === 'student') {
                document.getElementById('tab-student').classList.add('active');
                document.getElementById('btn-register').innerText = 'Register as Student';
            } else {
                document.getElementById('tab-teacher').classList.add('active');
                document.getElementById('btn-register').innerText = 'Register as Teacher';
            }
            
            // Trigger motion animation slightly
            if (window.triggerBounce) window.triggerBounce();
        }

        async function registerUser() {
            const u = document.getElementById('username').value;
            const f = document.getElementById('fullname').value;
            const p = document.getElementById('password').value;
            const r = currentRole;

            if(!u || !f || !p) return alert("Please fill all fields");

            const btn = document.getElementById('btn-register');
            const originalText = btn.innerText;
            btn.innerText = "Registering...";
            btn.disabled = true;

            try {
                const signupRes = await fetch(`/api/signup`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, full_name: f, password: p, role: r })
                });
                
                if(!signupRes.ok) {
                    const err = await signupRes.json();
                    return alert("Signup error: " + (err.detail || "Unknown error"));
                }
                
                const signupData = await signupRes.json();
                alert(`Registration Successful! You can now login as a ${r === 'admin' ? 'Teacher' : 'Student'}.`);
                window.location.href = "/";
            } catch (error) {
                console.error("Unexpected error during registration:", error);
                alert("An unexpected error occurred. Please check console.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
